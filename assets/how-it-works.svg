<svg viewBox="0 0 800 330" width="800" height="330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The governed loop: operator to orchestrator to pressure-test to builder to reviewer, publication back to operator">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9" fill="none" stroke="#3FB68B" stroke-width="1.4"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="330" rx="12" fill="#0E1116"/>
  <text x="400" y="34" text-anchor="middle" fill="#3FB68B" font-family="Menlo, Consolas, monospace" font-size="13">// the agent that builds a thing never approves it</text>
  <!-- operator -->
  <rect x="310" y="52" width="180" height="52" rx="8" fill="#1C232C" stroke="#3FB68B"/>
  <text x="400" y="74" text-anchor="middle" fill="#E8EDF2" font-family="Menlo, Consolas, monospace" font-size="14" font-weight="600">YOU / OPERATOR</text>
  <text x="400" y="92" text-anchor="middle" fill="#8B98A5" font-family="Helvetica, Arial, sans-serif" font-size="11">own the outcome, press the button</text>
  <!-- seats -->
  <rect x="30" y="184" width="160" height="52" rx="8" fill="#161B22" stroke="#2B3440"/>
  <text x="110" y="206" text-anchor="middle" fill="#E8EDF2" font-family="Menlo, Consolas, monospace" font-size="13">ORCHESTRATOR</text>
  <text x="110" y="224" text-anchor="middle" fill="#8B98A5" font-size="11" font-family="Helvetica, Arial, sans-serif">scopes and dispatches</text>
  <rect x="228" y="184" width="160" height="52" rx="8" fill="#161B22" stroke="#2B3440"/>
  <text x="308" y="206" text-anchor="middle" fill="#E8EDF2" font-family="Menlo, Consolas, monospace" font-size="13">PRESSURE-TEST</text>
  <text x="308" y="224" text-anchor="middle" fill="#8B98A5" font-size="11" font-family="Helvetica, Arial, sans-serif">attacks the plan first</text>
  <rect x="426" y="184" width="160" height="52" rx="8" fill="#161B22" stroke="#2B3440"/>
  <text x="506" y="206" text-anchor="middle" fill="#E8EDF2" font-family="Menlo, Consolas, monospace" font-size="13">BUILDER</text>
  <text x="506" y="224" text-anchor="middle" fill="#8B98A5" font-size="11" font-family="Helvetica, Arial, sans-serif">implements, never approves</text>
  <rect x="624" y="184" width="150" height="52" rx="8" fill="#161B22" stroke="#2B3440"/>
  <text x="699" y="206" text-anchor="middle" fill="#E8EDF2" font-family="Menlo, Consolas, monospace" font-size="13">REVIEWER</text>
  <text x="699" y="224" text-anchor="middle" fill="#8B98A5" font-size="11" font-family="Helvetica, Arial, sans-serif">fresh session, real check</text>
  <!-- arrows -->
  <path d="M355 104 L120 182" fill="none" stroke="#3FB68B" stroke-width="1.4" marker-end="url(#ah)"/>
  <path d="M190 210 L226 210" fill="none" stroke="#3FB68B" stroke-width="1.4" marker-end="url(#ah)"/>
  <path d="M388 210 L424 210" fill="none" stroke="#3FB68B" stroke-width="1.4" marker-end="url(#ah)"/>
  <path d="M586 210 L622 210" fill="none" stroke="#3FB68B" stroke-width="1.4" marker-end="url(#ah)"/>
  <path d="M699 182 L452 106" fill="none" stroke="#3FB68B" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="222" y="132" text-anchor="end" fill="#8B98A5" font-size="11" font-family="Menlo, Consolas, monospace">you say what you want</text>
  <text x="578" y="132" fill="#8B98A5" font-size="11" font-family="Menlo, Consolas, monospace">accepted work returns to you</text>
  <!-- bottom -->
  <text x="400" y="284" text-anchor="middle" fill="#D9A03F" font-family="Menlo, Consolas, monospace" font-size="12">publication is always yours, no seat can ship</text>
  <text x="400" y="306" text-anchor="middle" fill="#8B98A5" font-family="Helvetica, Arial, sans-serif" font-size="11">solo mode: one agent, same rules, seats return one at a time as stakes rise</text>
</svg>
